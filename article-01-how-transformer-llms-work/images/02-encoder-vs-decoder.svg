<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Encoder blocks versus decoder blocks</title>
<desc>A side-by-side comparison. The encoder block (teal) uses bidirectional self-attention that sees the whole sequence, then a feed-forward network. The decoder block (pink) uses masked, causal self-attention that only sees earlier tokens, an additional cross-attention layer that attends to the encoder's output — present in the original translation Transformer but dropped in decoder-only models like GPT — and then its own feed-forward network. An arrow shows the encoder's output feeding the decoder's cross-attention layer.</desc>
<defs>
<marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<rect x="140" y="40" width="120" height="30" rx="15" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="200" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Encoder</text>

<rect x="420" y="40" width="120" height="30" rx="15" fill="#F4C0D1" stroke="#993556" stroke-width="0.5"></rect>
<text x="480" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Decoder</text>

<line x1="200" y1="70" x2="200" y2="86" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"></line>
<line x1="480" y1="70" x2="480" y2="86" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"></line>
<line x1="200" y1="144" x2="200" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"></line>
<line x1="480" y1="144" x2="480" y2="162" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"></line>
<line x1="480" y1="236" x2="480" y2="254" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"></line>
<line x1="320" y1="201" x2="356" y2="201" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow5)"></line>

<rect x="80" y="90" width="240" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="200" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Self-attention</text>
<text x="200" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">sees the whole sequence</text>

<rect x="80" y="174" width="240" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="200" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Feed-forward network</text>
<text x="200" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">same as the decoder's</text>

<rect x="360" y="90" width="240" height="54" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"></rect>
<text x="480" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Masked self-attention</text>
<text x="480" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">only sees earlier tokens</text>

<rect x="360" y="166" width="240" height="70" rx="4" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.75" stroke-dasharray="4,3"></rect>
<text x="480" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Cross-attention</text>
<text x="480" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">attends to encoder output</text>
<text x="480" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">dropped in decoder-only LLMs</text>

<rect x="360" y="258" width="240" height="54" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"></rect>
<text x="480" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Feed-forward network</text>
<text x="480" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">same as the encoder's</text>

<text x="340" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">GPT-style LLMs stack only decoder blocks, minus the dashed cross-attention layer —</text>
<text x="340" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">there's no encoder output left to attend to.</text>

</svg>