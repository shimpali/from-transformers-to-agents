<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The pipeline from text to next token</title>
<desc>Text becomes tokens, tokens become embeddings, embeddings flow through a stack of transformer blocks, and the model outputs a next token.</desc>
<defs>
<marker id="arrow0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<line x1="150" y1="180" x2="159" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow0)"></line>
<line x1="272" y1="180" x2="281" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow0)"></line>
<line x1="394" y1="180" x2="403" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow0)"></line>
<line x1="516" y1="180" x2="525" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow0)"></line>

<rect x="40" y="150" width="110" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="95" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#444441">Text</text>

<rect x="162" y="150" width="110" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="217" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Tokens</text>
<text x="217" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">integer IDs</text>

<rect x="284" y="150" width="110" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="339" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Embeddings</text>
<text x="339" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">vectors</text>

<rect x="406" y="150" width="110" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="461" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Transformer</text>
<text x="461" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">×N blocks</text>

<rect x="528" y="150" width="110" height="60" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"></rect>
<text x="583" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Next token</text>
<text x="583" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">sampled</text>

<text x="340" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Run this once per output token, feeding each new token back in, and you get generation.</text>

</svg>