<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The autoregressive generation loop</title>
<desc>A diagram showing text generation as a loop: the tokens so far go through the decoder stack, which produces a probability over the vocabulary for the next token; a token is sampled from that distribution, appended to the input, and the whole process repeats.</desc>
<defs>
<marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<line x1="180" y1="180" x2="189" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow6)"></line>
<line x1="333" y1="180" x2="342" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow6)"></line>
<line x1="486" y1="180" x2="495" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow6)"></line>

<path d="M569,210 V290 H410" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="3,3"></path>
<path d="M270,290 H110 V214" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow6)"></path>

<rect x="270" y="275" width="140" height="30" rx="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="340" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">append &amp; repeat</text>

<rect x="40" y="150" width="140" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="110" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#444441">Tokens so far</text>

<rect x="193" y="150" width="140" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="263" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Decoder stack</text>
<text x="263" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">×N blocks</text>

<rect x="346" y="150" width="140" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="416" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Vocab scores</text>
<text x="416" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">one per token</text>

<rect x="499" y="150" width="140" height="60" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"></rect>
<text x="569" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Sample token</text>
<text x="569" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">pick the next</text>

<text x="340" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Every loop produces exactly one new token, using the whole sequence generated so far.</text>
<text x="340" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Repeat until an end-of-sequence token appears or a length limit is hit.</text>

</svg>