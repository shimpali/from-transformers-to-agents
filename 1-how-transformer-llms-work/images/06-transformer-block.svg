<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Inside a transformer block</title>
<desc>A diagram of one transformer block: token and position embeddings flow into multi-head self-attention, then an add-and-normalize step, then a feed-forward network, then a second add-and-normalize step, producing the block's output. Residual connections skip around both the attention and feed-forward sub-layers. A bracket on the left shows this whole block repeats N times.</desc>
<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<line x1="340" y1="84" x2="340" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow4)"></line>
<line x1="340" y1="166" x2="340" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow4)"></line>
<line x1="340" y1="248" x2="340" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow4)"></line>
<line x1="340" y1="330" x2="340" y2="352" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow4)"></line>
<line x1="340" y1="412" x2="340" y2="434" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow4)"></line>

<path d="M480,62 H560 V221 H489" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow4)"></path>
<path d="M480,221 H600 V385 H489" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow4)"></path>
<circle cx="480" cy="221" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"></circle>
<text x="480" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#444441">+</text>
<circle cx="480" cy="385" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"></circle>
<text x="480" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#444441">+</text>

<rect x="200" y="40" width="280" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="340" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#444441">Token + position embeddings</text>

<rect x="200" y="112" width="280" height="54" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="340" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Multi-head self-attention</text>
<text x="340" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">context from every other token</text>

<rect x="200" y="194" width="280" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="340" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Add &amp; normalize</text>
<text x="340" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">residual + layer norm</text>

<rect x="200" y="276" width="280" height="54" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="340" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Feed-forward network</text>
<text x="340" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">same network, every position</text>

<rect x="200" y="358" width="280" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="340" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Add &amp; normalize</text>
<text x="340" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">residual + layer norm</text>

<rect x="200" y="440" width="280" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="340" y="467" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#444441">Block output → next block</text>

<path d="M170,112 H150 V412 H170" fill="none" stroke="#5F5E5A" stroke-width="1"></path>
<rect x="50" y="247" width="100" height="30" rx="15" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="100" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">×N layers</text>

<text x="340" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Dashed lines are residual connections — they carry the input forward unchanged,</text>
<text x="340" y="538" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">so a block only has to learn what to add, not the whole representation from scratch.</text>

</svg>