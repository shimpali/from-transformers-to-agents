<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Self-attention weights from the token &#34;it&#34;</title>
<desc>A diagram of the sentence &#34;The cat sat because it was tired,&#34; showing the word &#34;it&#34; attending to every other word. The connecting arc to &#34;cat&#34; is thickest and darkest, showing it receives the most attention weight (62%), which is how the model resolves what &#34;it&#34; refers to.</desc>

<path d="M 427 200 Q 253 50 79 200" fill="none" stroke="#0F6E56" stroke-width="1.2" opacity="0.33"></path>
<path d="M 427 200 Q 296.5 70 166 200" fill="none" stroke="#0F6E56" stroke-width="6" opacity="0.92"></path>
<path d="M 427 200 Q 340 100 253 200" fill="none" stroke="#0F6E56" stroke-width="1.64" opacity="0.38"></path>
<path d="M 427 200 Q 383.5 140 340 200" fill="none" stroke="#0F6E56" stroke-width="1.4" opacity="0.35"></path>
<path d="M 427 200 Q 470.5 140 514 200" fill="none" stroke="#0F6E56" stroke-width="1.56" opacity="0.37"></path>
<path d="M 427 200 Q 514 100 601 200" fill="none" stroke="#0F6E56" stroke-width="2.2" opacity="0.45"></path>

<circle cx="79" cy="200" r="3" fill="#0F6E56" opacity="0.33"></circle>
<circle cx="166" cy="200" r="3" fill="#0F6E56" opacity="0.92"></circle>
<circle cx="253" cy="200" r="3" fill="#0F6E56" opacity="0.38"></circle>
<circle cx="340" cy="200" r="3" fill="#0F6E56" opacity="0.35"></circle>
<circle cx="514" cy="200" r="3" fill="#0F6E56" opacity="0.37"></circle>
<circle cx="601" cy="200" r="3" fill="#0F6E56" opacity="0.45"></circle>

<rect x="40" y="200" width="78" height="44" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="79" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">The</text>
<text x="79" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">3%</text>

<rect x="127" y="200" width="78" height="44" fill="#0F6E56" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="166" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#E1F5EE">cat</text>
<text x="166" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9FE1CB">62%</text>

<rect x="214" y="200" width="78" height="44" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="253" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">sat</text>
<text x="253" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">8%</text>

<rect x="301" y="200" width="78" height="44" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="340" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">because</text>
<text x="340" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">5%</text>

<rect x="388" y="200" width="78" height="44" fill="#185FA5" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="427" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#E6F1FB">it</text>
<text x="427" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#B5D4F4">query</text>

<rect x="475" y="200" width="78" height="44" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="514" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">was</text>
<text x="514" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">7%</text>

<rect x="562" y="200" width="78" height="44" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="601" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">tired</text>
<text x="601" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">15%</text>

<text x="340" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Line thickness = attention weight from &#34;it&#34; to that word.</text>
<text x="340" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Most of it lands on &#34;cat&#34; — that's how the model resolves the pronoun.</text>

</svg>