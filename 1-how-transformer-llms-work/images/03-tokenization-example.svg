<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a sentence becomes token IDs</title>
<desc>A diagram showing the sentence &#34;Self-attention is powerful&#34; being split into six subword tokens, then mapped to six integer token IDs.</desc>
<defs>
<marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<rect x="140" y="40" width="400" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="340" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#444441">&#34;Self-attention is powerful&#34;</text>

<line x1="340" y1="90" x2="340" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow1)"></line>

<g>
<rect x="40" y="140" width="95" height="50" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="87.5" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Self</text>
</g>
<g>
<rect x="135" y="140" width="65" height="50" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="167.5" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">-</text>
</g>
<g>
<rect x="200" y="140" width="140" height="50" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="270" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">attention</text>
</g>
<g>
<rect x="340" y="140" width="85" height="50" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="382.5" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">is</text>
</g>
<g>
<rect x="425" y="140" width="120" height="50" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="485" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">power</text>
</g>
<g>
<rect x="545" y="140" width="95" height="50" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="592.5" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">ful</text>
</g>

<line x1="87.5" y1="190" x2="87.5" y2="224" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2,2"></line>
<line x1="167.5" y1="190" x2="167.5" y2="224" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2,2"></line>
<line x1="270" y1="190" x2="270" y2="224" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2,2"></line>
<line x1="382.5" y1="190" x2="382.5" y2="224" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2,2"></line>
<line x1="485" y1="190" x2="485" y2="224" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2,2"></line>
<line x1="592.5" y1="190" x2="592.5" y2="224" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2,2"></line>

<g>
<rect x="59.5" y="224" width="56" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="87.5" y="241.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">15352</text>
</g>
<g>
<rect x="139.5" y="224" width="56" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="167.5" y="241.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">12</text>
</g>
<g>
<rect x="242" y="224" width="56" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="270" y="241.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">6207</text>
</g>
<g>
<rect x="354.5" y="224" width="56" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="382.5" y="241.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">318</text>
</g>
<g>
<rect x="457" y="224" width="56" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="485" y="241.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">1176</text>
</g>
<g>
<rect x="564.5" y="224" width="56" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="592.5" y="241.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">913</text>
</g>

<text x="340" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">The model never sees the string — only this list of integer IDs.</text>

</svg>