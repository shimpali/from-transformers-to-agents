<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Embeddings project tokens into a semantic space</title>
<desc>A simplified two-dimensional view of word embeddings. King, queen, man, and woman cluster together, with the king-to-queen and man-to-woman relationships pointing in the same direction and distance. Cat and dog form a separate, unrelated cluster elsewhere in the space.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<rect x="80" y="60" width="520" height="280" rx="4" fill="none" stroke="#D3D1C7" stroke-width="0.5"></rect>

<rect x="100" y="90" width="220" height="200" rx="8" fill="none" stroke="#0F6E56" stroke-width="0.75" stroke-dasharray="4,3"></rect>
<text x="112" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#085041">royalty &amp; gender</text>

<rect x="440" y="255" width="160" height="90" rx="8" fill="none" stroke="#993C1D" stroke-width="0.75" stroke-dasharray="4,3"></rect>
<text x="452" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#712B13">animals</text>

<line x1="140" y1="157" x2="140" y2="243" stroke="#0F6E56" stroke-width="1.25" stroke-dasharray="3,3" marker-end="url(#arrow2)"></line>
<line x1="260" y1="127" x2="260" y2="213" stroke="#0F6E56" stroke-width="1.25" stroke-dasharray="3,3" marker-end="url(#arrow2)"></line>

<circle cx="140" cy="150" r="5" fill="#0F6E56"></circle>
<text x="152" y="154" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">man</text>

<circle cx="140" cy="250" r="5" fill="#0F6E56"></circle>
<text x="152" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">woman</text>

<circle cx="260" cy="120" r="5" fill="#0F6E56"></circle>
<text x="272" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">king</text>

<circle cx="260" cy="220" r="5" fill="#0F6E56"></circle>
<text x="272" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">queen</text>

<circle cx="480" cy="280" r="5" fill="#993C1D"></circle>
<text x="492" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#712B13">cat</text>

<circle cx="540" cy="300" r="5" fill="#993C1D"></circle>
<text x="552" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#712B13">dog</text>

<text x="340" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Similar meanings sit close together, and consistent relationships (male → female) point the same way.</text>

</svg>