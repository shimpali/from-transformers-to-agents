<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Choosing the right tool for the task</title>
<desc>Flowchart: if the task needs fresh external information, search the web. Otherwise, if it needs exact math or a chart, run code. Otherwise, if it needs a file read or written, use file tools. Otherwise, answer directly.</desc>
<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<rect x="40" y="30" width="240" height="60" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"></rect>
<text x="160" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#633806">Needs fresh outside info?</text>
<text x="160" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#854F0B">recent, local, or niche</text>
<line x1="280" y1="60" x2="379" y2="60" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"></line>
<text x="330" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text>
<rect x="380" y="30" width="260" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="510" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Web search</text>
<text x="510" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">e.g. a highly rated gym near me</text>

<line x1="160" y1="90" x2="160" y2="129" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"></line>
<text x="176" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text>

<rect x="40" y="130" width="240" height="60" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"></rect>
<text x="160" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#633806">Needs exact math or a chart?</text>
<text x="160" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#854F0B">numbers, trends, calculations</text>
<line x1="280" y1="160" x2="379" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"></line>
<text x="330" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text>
<rect x="380" y="130" width="260" height="60" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"></rect>
<text x="510" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Run code</text>
<text x="510" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">e.g. what are my sales trends?</text>

<line x1="160" y1="190" x2="160" y2="229" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"></line>
<text x="176" y="214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text>

<rect x="40" y="230" width="240" height="60" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"></rect>
<text x="160" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#633806">Needs a file read or written?</text>
<text x="160" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#854F0B">your documents, a new report</text>
<line x1="280" y1="260" x2="379" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"></line>
<text x="330" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text>
<rect x="380" y="230" width="260" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"></rect>
<text x="510" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Read or write a file</text>
<text x="510" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#534AB7">e.g. summarize the attached report</text>

<line x1="160" y1="290" x2="160" y2="329" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar2)"></line>
<text x="176" y="314" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text>

<rect x="40" y="330" width="240" height="60" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="160" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Answer directly</text>
<text x="160" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">e.g. why do cats stare at walls?</text>

<text x="340" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Complex, multi-source questions can combine these steps, which is what deep research automates.</text>
</svg>
