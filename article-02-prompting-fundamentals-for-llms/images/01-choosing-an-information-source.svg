<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Choosing an information source</title>
<desc>Flowchart: start with your question. If it needs recent, local, or niche information, go on; otherwise use pretrained knowledge. If it is also complex and multi-part, use deep research; otherwise use web search.</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>
<rect x="250" y="20" width="180" height="46" rx="23" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"></rect>
<text x="340" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#444441">Your question</text>
<line x1="340" y1="66" x2="340" y2="99" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar1)"></line>

<rect x="190" y="100" width="300" height="60" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"></rect>
<text x="340" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#633806">Is it recent, local, or niche?</text>
<text x="340" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#854F0B">after the training cutoff, near me, rarely discussed</text>

<path d="M190,130 H110 V299" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar1)"></path>
<text x="150" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text>
<line x1="340" y1="160" x2="340" y2="199" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar1)"></line>
<text x="356" y="184" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text>

<rect x="190" y="200" width="300" height="60" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"></rect>
<text x="340" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#633806">Is it complex and multi-part?</text>
<text x="340" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#854F0B">needs many sources compared and combined</text>

<line x1="340" y1="260" x2="340" y2="299" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar1)"></line>
<text x="356" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">No</text>
<path d="M490,230 H575 V299" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar1)"></path>
<text x="530" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#444441">Yes</text>

<rect x="30" y="300" width="160" height="70" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"></rect>
<text x="110" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Pretrained knowledge</text>
<text x="110" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#185FA5">facts, definitions, summaries</text>

<rect x="260" y="300" width="160" height="70" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"></rect>
<text x="340" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#085041">Web search</text>
<text x="340" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">seconds, a few sources</text>

<rect x="490" y="300" width="170" height="70" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"></rect>
<text x="575" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#72243E">Deep research</text>
<text x="575" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#993556">minutes, many sources, cited</text>

<text x="340" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Not sure whether the model will search? Ask for it explicitly.</text>
</svg>
